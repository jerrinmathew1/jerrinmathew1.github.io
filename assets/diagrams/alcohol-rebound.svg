<svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg" class="diagram">
  <defs>
    <style>
      .diagram-label { font-family: Inter, sans-serif; font-size: 12px; fill: #1A1C1E; }
      .diagram-axis { stroke: #7C8B7A; stroke-width: 1.5; fill: none; }
      .diagram-line { stroke: #17293F; stroke-width: 2.5; fill: none; }
      .diagram-zone { fill: #E8A9A0; opacity: 0.15; }
    </style>
  </defs>
  
  <text x="250" y="25" text-anchor="middle" class="diagram-label" font-weight="600" font-size="14">Alcohol and Sleep: The Rebound Effect</text>
  
  <!-- Axes -->
  <line x1="60" y1="220" x2="480" y2="220" class="diagram-axis"/>
  <line x1="60" y1="40" x2="60" y2="220" class="diagram-axis"/>
  
  <!-- Axis labels -->
  <text x="30" y="225" class="diagram-label" font-size="11">Arousal</text>
  <text x="485" y="235" class="diagram-label" font-size="11">Time</text>
  
  <!-- Time markers -->
  <text x="150" y="240" text-anchor="middle" class="diagram-label" font-size="10">Evening</text>
  <text x="270" y="240" text-anchor="middle" class="diagram-label" font-size="10">Midnight</text>
  <text x="390" y="240" text-anchor="middle" class="diagram-label" font-size="10">3–4 AM</text>
  <text x="460" y="240" text-anchor="middle" class="diagram-label" font-size="10">Morning</text>
  
  <!-- Zones -->
  <rect x="60" y="80" width="150" height="140" class="diagram-zone"/>
  <rect x="360" y="60" width="120" height="160" class="diagram-zone"/>
  
  <!-- Zone labels -->
  <text x="135" y="155" text-anchor="middle" class="diagram-label" font-size="11" fill="#9A7548" font-weight="500">Sleep begins</text>
  <text x="420" y="135" text-anchor="middle" class="diagram-label" font-size="11" fill="#9A7548" font-weight="500">Rebound arousal</text>
  
  <!-- The curve -->
  <path d="M 60 200 L 150 90 L 270 85 L 360 120 L 460 70" class="diagram-line"/>
  
  <!-- Annotations -->
  <text x="120" y="65" class="diagram-label" font-size="10" fill="#17293F" font-weight="500">Depressant effect</text>
  <text x="410" y="45" class="diagram-label" font-size="10" fill="#17293F" font-weight="500">Increased REM</text>
</svg>